services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    expose:
      - "3000"
    depends_on:
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
  
  redis:
    image: redis:alpine
    container_name: redis
    expose:
    - "6379"